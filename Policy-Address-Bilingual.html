ork on all fronts, and the results are now visible.",zh:"主席、各位尊敬的議員，過去一年是鞏固與前行的一年。我們在各方面迎難而上，工作已見成效。"},{id:3,theme:"開場",en:"Today, I shall set out our blueprint for the year ahead — a blueprint that is practical, forward-looking, and firmly anchored in the interests of our community.",zh:"今天，我將闡述來年的施政藍圖——一份務實、前瞻，並以市民利益為依歸的藍圖。"},{id:4,theme:"管治",en:"Good governance is the foundation of a stable and prosperous society. We are committed to enhancing the efficiency and effectiveness of our public services.",zh:"良政善治是社會穩定繁榮的基石。我們致力提升公共服務的效率和效能。"},{id:5,theme:"管治",en:"We are determined to strengthen coordination across policy bureaux and departments, breaking down silos and improving the delivery of public services.",zh:"我們決心加強政策局與部門之間的統籌，打破壁壘，提升公共服務的質量。"},{id:6,theme:"管治",en:"Our guiding principle is simple: to serve the people, to be pragmatic in our approach, and to deliver results that can be seen and felt in the daily lives of our citizens.",zh:"我們的指導原則很簡單：以民為本，務實進取，讓市民在日常生活中切實感受到施政成果。"},{id:7,theme:"經濟",en:"Economic development remains the central plank of our work. A vibrant economy creates opportunities, sustains livelihoods, and funds the public services we all rely on.",zh:"經濟發展是我們工作的重中之重。蓬勃的經濟創造機遇、保障民生，並為我們賴以為生的公共服務提供資金。"},{id:8,theme:"經濟",en:"We are committed to consolidating and enhancing our status as an international financial, shipping, and trade centre.",zh:"我們致力鞏固和提升香港作為國際金融、航運和貿易中心的地位。"},{id:9,theme:"經濟",en:"Our aim is to create an environment in which businesses can thrive — a level playing field, a transparent regulatory regime, and a competitive tax system.",zh:"我們的目標是營造有利營商的環境——提供公平競爭的環境、具透明度的監管制度和具競爭力的稅制。"},{id:10,theme:"民生",en:"The well-being of our citizens is the ultimate purpose of government. We will continue to devote substantial resources to improving people's livelihood.",zh:"市民的福祉是政府施政的最終目的。我們將繼續投放大量資源改善民生。"},{id:11,theme:"民生",en:"On housing, we remain resolute. We will press ahead with land production and housing supply, with a view to easing the burden on families and shortening the wait for public housing.",zh:"在房屋問題上，我們立場堅定。我們會繼續全力造地建屋，以期減輕家庭負擔，縮短公屋輪候時間。"},{id:12,theme:"民生",en:"We are committed to building a caring and inclusive society — one that looks after the young, supports the elderly, and empowers those in need.",zh:"我們致力建設關愛共融的社會——一個關顧年輕人、支援長者、賦能弱勢的社會。"},{id:13,theme:"青年教育",en:"Our young people are the future of Hong Kong. We will invest in their education, broaden their horizons, and create pathways for them to realise their aspirations.",zh:"年輕人是香港的未來。我們會投資於他們的教育，拓闊他們的視野，並為他們創造實現抱負的途徑。"},{id:14,theme:"青年教育",en:"Education is not merely the transmission of knowledge; it is the cultivation of character, values, and a sense of belonging.",zh:"教育不僅是知識的傳授，更是品格、價值觀和歸屬感的培養。"},{id:15,theme:"創科",en:"Innovation and technology are key drivers of our future economic growth. We will accelerate our efforts to build Hong Kong into an international innovation and technology hub.",zh:"創新科技是推動未來經濟增長的關鍵動力。我們會加快步伐，把香港建設成為國際創新科技中心。"},{id:16,theme:"創科",en:"We will strengthen the connection between research and application, ensuring that our investment in science and technology translates into real-world benefits.",zh:"我們會加強科研與應用的聯繫，確保科技投資轉化為實實在在的裨益。"},{id:17,theme:"環保",en:"We are committed to building a greener, more sustainable Hong Kong — for our own generation and for those to come.",zh:"我們致力建設更綠色、更可持續的香港——為我們這一代，也為下一代。"},{id:18,theme:"環保",en:"Addressing climate change is not a choice but an imperative. We will press ahead with our decarbonisation strategy and the transition to a low-carbon economy.",zh:"應對氣候變化不是選擇，而是必須。我們會堅定推行減碳策略，推動向低碳經濟轉型。"},{id:19,theme:"落實",en:"Good policies are measured by their results. We are committed to rigorous implementation, clear accountability, and transparent reporting to this Council and to the public.",zh:"好的政策以成效作衡量。我們致力嚴謹落實、問責分明，並向本會及公眾作出具透明度的匯報。"},{id:20,theme:"落實",en:"This Policy Address is not an end in itself. It is a commitment — a commitment to act, to deliver, and to make a real difference to the lives of our citizens.",zh:"這份《施政報告》本身並非終點，而是一份承諾——一份付諸行動、落實成果、切實改善市民生活的承諾。"},{id:21,theme:"總結",en:"Let us work together — Government, business, and the community — to build a better Hong Kong for all.",zh:"讓我們攜手合作——政府、商界和社區——共建更美好的香港。"},{id:22,theme:"總結",en:"With unity of purpose and firmness of resolve, I am confident that we can overcome the difficulties before us and create a brighter future for our city.",zh:"只要我們目標一致、堅定不移，我深信我們定能克服眼前困難，為香港開創更光明的未來。"},{id:23,theme:"財政原則",en:"Fiscal policy refers to the government's use of taxation and public spending to influence the economy.",zh:"財政政策是指政府運用稅收和公共開支來影響經濟的政策。"},{id:24,theme:"財政原則",en:"The Government adheres to the principle of keeping expenditure within the limits of revenues, as enshrined in Article 107 of the Basic Law.",zh:"政府恪守《基本法》第一百零七條所訂明量入為出的原則。"},{id:25,theme:"財政原則",en:"Prudent fiscal management remains a cornerstone of Hong Kong's economic success.",zh:"審慎理財一直是香港經濟成功的基石。"},{id:26,theme:"財政原則",en:"The Government is committed to maintaining a balanced budget over the medium term while addressing the city's evolving social and economic needs.",zh:"政府致力在中期維持收支平衡，同時應對本港不斷演變的社會和經濟需要。"},{id:27,theme:"財政原則",en:"Fiscal reserves provide a robust buffer against external shocks and unforeseen contingencies.",zh:"財政儲備為應對外來衝擊和突發情況提供了堅實的緩衝。"},{id:28,theme:"預算",en:"The Budget aims to balance the dual objectives of supporting economic growth and maintaining fiscal sustainability.",zh:"財政預算案旨在平衡支持經濟增長和維持財政可持續性的雙重目標。"},{id:29,theme:"收入",en:"The Government will continue to review the taxation regime to enhance Hong Kong's competitiveness.",zh:"政府會繼續檢視稅制，以提升香港的競爭力。"},{id:30,theme:"收入",en:"Land premium remains a significant but volatile source of government revenue.",zh:"地價收入仍然是政府一個重要但波動的收入來源。"},{id:31,theme:"開支",en:"Total government expenditure for the financial year 202X/2X is estimated at HK$XX billion, representing an increase of XX per cent over the previous year.",zh:"二零二X／二X年度政府總開支預計為港幣XX億元，較上一年度增加XX%。"},{id:32,theme:"開支",en:"The Government will allocate additional resources to XX, reflecting its priority in the coming years.",zh:"政府將向XX增撥額外資源，反映其在未來數年的優先地位。"},{id:33,theme:"開支",en:"The Government has earmarked HK$XX billion for XX over the next decade.",zh:"政府已預留港幣XX億元，在未來十年用於XX。"},{id:34,theme:"逆週期",en:"In light of the economic downturn, the Government has introduced a package of relief measures amounting to approximately HK$XX billion.",zh:"鑑於經濟下行，政府已推出總額約港幣XX億元的紓困措施。"},{id:35,theme:"逆週期",en:"The relief measures aim to ease the financial burden on citizens and businesses while supporting economic recovery.",zh:"有關紓困措施旨在減輕市民和企業的財政負擔，同時支持經濟復蘇。"},{id:36,theme:"逆週期",en:"These counter-cyclical measures are designed to stabilise the economy without undermining long-term fiscal discipline.",zh:"這些逆週期措施旨在穩定經濟，同時不削弱長遠的財政紀律。"},{id:37,theme:"可持續",en:"The Government will closely monitor the medium-term fiscal position to ensure sustainability.",zh:"政府會密切監察中期財政狀況，以確保財政可持續性。"},{id:38,theme:"可持續",en:"A sustainable fiscal framework is essential to safeguarding Hong Kong's economic stability and social development.",zh:"可持續的財政框架對於保障香港的經濟穩定和社會發展至關重要。"}];var Vc=vn(ft(),1),wh=Symbol.for("react.element"),kh=Symbol.for("react.fragment"),Sh=Object.prototype.hasOwnProperty,Eh=Vc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Ch={key:!0,ref:!0,__self:!0,__source:!0};function Ac(e,n,t){var r,l={},o=null,i=null;t!==void 0&&(o=""+t),n.key!==void 0&&(o=""+n.key),n.ref!==void 0&&(i=n.ref);for(r in n)Sh.call(n,r)&&!Ch.hasOwnProperty(r)&&(l[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)l[r]===void 0&&(l[r]=n[r]);return{$$typeof:wh,type:e,key:o,ref:i,props:l,_owner:Eh.current}}var Tl=kh,z=Ac,N=Ac;var Ll=Hc,eu={"開場":{color:"#0F2C61",en:"Opening"},"管治":{color:"#1E3A8A",en:"Governance"},"經濟":{color:"#A67C00",en:"Economy"},"民生":{color:"#0E7490",en:"Livelihood"},"青年教育":{color:"#6D28D9",en:"Youth & Education"},"創科":{color:"#0891B2",en:"I&T"},"環保":
