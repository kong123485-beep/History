向制度。",strengths:["建立完整倫理與教育體系","強調責任、修養與社會秩序","對東亞文化影響最深遠"],modern:"職場做人、家庭教育同公共倫理，至今仍然用緊儒家嗰套：尊重人、守承諾、做事有分寸。",vibe:"溫潤而有原則嘅大家長",influence:"漢代獨尊儒術，成為兩千年主流思想。",founder:"孔子",claim:"仁政德治"},{id:"dao",name:"道家",pinyin:"DÀO JIĀ",color:"#3f6250",soft:"#e2eee6",people:"老子 · 莊子",core:"道法自然 · 無為而治",works:"《道德經》《莊子》",quote:"上善若水，水善利萬物而不爭。",tags:["出世","修身"],era:"春秋晚期至戰國盛行",year:"前 6 世紀",intro:"老子講「道」，莊子講「逍遙」。道家唔係叫你咩都唔做，而係提醒你：過度干預，反而壞事。順應自然，留白先有空間，柔弱先至最有韌性。",strengths:["提供另一種自由觀","提醒人放鬆、減壓、回歸本質","影響醫學、養生、山水藝術"],modern:"當世界太嘈，道家就係你嘅深呼吸：唔好硬碰，識得退一步、留白、順勢而行。",vibe:"行到邊都咁自在嘅隱士",influence:"影響魏晉玄學、道教與中國藝術。",founder:"老子",claim:"道法自然"},{id:"yin",name:"陰陽家",pinyin:"YĪN YÁNG JIĀ",color:"#6d5b99",soft:"#ebe7f6",people:"鄒衍",core:"陰陽五行 · 五德終始",works:"《鄒子》",quote:"天有五行，地有五方；陰陽相推，終始循環。",tags:["出世","治國"],era:"戰國中期，齊國稷下學宮",year:"前 4 世紀",intro:"鄒衍將陰陽、五行變成一套解釋天、地、人、王朝更替嘅大理論。「五德終始」話每朝代都有對應嘅德，德盡就會被取代。呢套說法，令天文、曆法、醫學同政治都連成一線。",strengths:["最早嘅系統宇宙觀","連結自然規律與人事變化","奠定中醫五行理論基礎"],modern:"五行、節氣、陰陽平衡，今日仲喺中醫、飲食同生活節奏入面出現。",vibe:"望天就知天下事嘅觀察家",influence:"影響曆法、中醫、堪輿與王朝正統論。",founder:"鄒衍",claim:"陰陽五行"},{id:"fa",name:"法家",pinyin:"FǍ JIĀ",color:"#223f66",soft:"#e1e9f4",people:"韓非 · 商鞅 · 李斯",core:"以法治國 · 嚴刑峻法",works:"《韓非子》《商君書》",quote:"法不阿貴，繩不撓曲。",tags:["入世","治國"],era:"戰國晚期，秦國變法",year:"前 4 世紀",intro:"法家唔信人性，信制度。商鞅變法令秦國強大；韓非將「法、術、勢」集大成，話明君要靠公開規則、賞罰分明，而唔係靠人情。法家冷靜、務實，甚至有啲無情。",strengths:["建立法治與績效觀念","推動秦國富強與統一","強調制度勝過人治"],modern:"公司制度、KPI、法治社會，背後都有法家嘅影子：規則清楚，先至公平同有效率。",vibe:"鐵面無私嘅改革者",influence:"秦統一六國，制度影響後世王朝。",founder:"韓非",claim:"法術勢並重"},{id:"ming",name:"名家",pinyin:"MÍNG JIĀ",color:"#9a6822",soft:"#f7eeda",people:"惠施 · 公孫龍",core:"名實之辯 · 白馬非馬",works:"《公孫龍子》",quote:"白馬非馬，可乎？曰：可。",tags:["修身","入世"],era:"戰國中期，辯論風氣最盛",year:"前 4 世紀",intro:"名家係古代嘅邏輯學家。佢哋鍾意追問：個名同實際係咪同一回事？「白馬非馬」唔係玩文字遊戲，而係挑戰人對概念嘅慣性理解。惠施仲提出相對、無限等超前想法。",strengths:["開創中國邏輯與語言哲學","訓練思辨與辯論能力","挑戰習以為常嘅定義"],modern:"今日做產品、寫合約、辯論政策，名家會話你：定義講清楚先，唔好各講各。",vibe:"一句說話可以拗足全晚嘅辯手",influence:"影響後世辯論、邏輯與語言研究。",founder:"惠施",claim:"名實之辯"},{id:"mo",name:"墨家",pinyin:"MÒ JIĀ",color:"#356b68",soft:"#e0efed",people:"墨子",core:"兼愛非攻 · 尚賢尚同",works:"《墨子》",quote:"兼相愛，交相利。",tags:["入世","治國"],era:"戰國時期，與儒家並稱顯學",year:"前 5 世紀",intro:"墨子出身平民，主張「兼愛」：唔好分親疏，人人都要相愛互利。佢反對戰爭、反對奢侈，主張節用、尚賢，仲識守城、搞工程。墨家係最早講「人人平等」同「實用主義」嘅學派之一。",strengths:["最早嘅平民思想與和平主張","重視科技、工程與實用","強調能力而唔係出身"],modern:"公益、環保、反戰、技術向善，全部都有墨家精神：唔好浪費，幫到人先係真本事。",vibe:"落手落腳幫人嘅實幹派",influence:"與儒家並稱顯學，影響科技與社會思想。",founder:"墨子",claim:"兼愛非攻"},{id:"zong",name:"縱橫家",pinyin:"ZÒNG HÉNG JIĀ",color:"#a84a2d",soft:"#fbe9e0",people:"鬼谷子 · 蘇秦 · 張儀",core:"合縱連橫 · 遊說外交",works:"《鬼谷子》《戰國策》",quote:"智者不用其所短，而用其所長。",tags:["入世","治國"],era:"戰國晚期，七國爭霸",year:"前 4 世紀",intro:"縱橫家係戰國嘅外交高手。蘇秦配六國相印，張儀以連橫破合縱，一張嘴可以改變天下格局。鬼谷子教嘅唔只係說話技巧，仲有察言觀色、審時度勢，係古代嘅戰略顧問。",strengths:["外交、談判與戰略思維","識得睇形勢、搵盟友","溝通能力一流"],modern:"商業談判、外交、公關、遊說，縱橫家就係祖師爺：講嘢唔只講道理，仲要講時機。",vibe:"一開口就扭轉局勢嘅談判高手",influence:"左右戰國格局，影響外交與謀略文化。",founder:"鬼谷子",claim:"合縱連橫"},{id:"za",name:"雜家",pinyin:"ZÁ JIĀ",color:"#7a5540",soft:"#f1e8df",people:"呂不韋",core:"兼儒墨 · 合名法 · 雜取百家",works:"《呂氏春秋》《淮南子》",quote:"兼聽則明，偏信則暗。",tags:["入世","治國"],era:"秦代，呂不韋主編",year:"前 239 年",intro:"雜家唔係大雜燴，而係「整合」。呂不韋集門客之力編成《呂氏春秋》，將儒、墨、道、法、農、陰陽等思想融為一爐，想為一個大一統王朝搵一套完整嘅治國指南。",strengths:["兼容並包，博採眾長","重視綜合、協調與實用","保存大量先秦思想資料"],modern:"今日做跨界整合、政策研究、產品設計，都需要雜家精神：唔好只企一邊，集百家之長。",vibe:"乜都識啲、識得整合嘅通才",influence:"為秦漢思想整合提供範本。",founder:"呂不韋",claim:"雜取百家"},{id:"nong",name:"農家",pinyin:"NÓNG JIĀ",color:"#6d7a2b",soft:"#eef1dc",people:"許行",core:"君民並耕 · 重農",works:"《神農》已佚",quote:"賢者與民並耕而食，饔飧而治。",tags:["入世","修身"],era:"戰國中期，滕國一帶",year:"前 4 世紀",intro:"農家主張君王都要落田耕作，先至明白民間疾苦。佢哋重視農業生產、糧食自給，反對重商輕農。雖然著作大多散佚，但「民以食為天」呢句話，農家功不可沒。",strengths:["貼近民生與土地","強調勞動價值與自給自足","提醒統治者唔好脫離現實"],modern:"食安、永續農業、在地生產，農家早就講咗：識食，先要識耕。",vibe:"最貼地、最有泥土味嘅實幹家",influence:"影響中國重農傳統與民生思想。",founder:"許行",claim:"君民並耕"},{id:"xiao",name:"小說家",pinyin:"XIǍO SHUŌ JIĀ",color:"#a04f76",soft:"#f9e4ee",people:"街談巷語 · 道聽途說者",core:"反映民間生活 · 小道不可廢",works:"街談巷語、民間故事",quote:"小道必有可觀者焉，致遠恐泥。",tags:["出世","修身"],era:"先秦民間，口耳相傳",year:"先秦時期",intro:"小說家唔係寫小說嘅作家，而係收集街頭巷尾傳聞嘅人。班固話佢係「小道」，但「雖小道，必有可觀者焉」——民間八卦、笑話、傳說，其實最真實反映社會生活。冇佢哋，我哋就聽唔到古人嘅日常。",strengths:["保存民間聲音與生活","最早嘅社會觀察與故事傳統","令歷史有溫度、有血有肉"],modern:"社交媒體、街坊故事、都市傳說，全部都係小說家嘅後代：大道理之外，仲要聽下人間煙火。",vibe:"最八卦、最識講故嘅街坊",influence:"開創小說、故事與民間文學傳統。",founder:"街談巷語者",claim:"採集民間傳說"}],Bm=["全部","入世","出世","治國","修身"],$m=[{year:"前 551",title:"孔子誕生 · 儒家開端",text:"孔子周遊列國，收徒講學，儒家思想開始成形。",school:"儒家"},{year:"前 5 世紀",title:"墨子創立墨家",text:"兼愛非攻、尚賢節用，墨家與儒家並稱顯學。",school:"墨家"},{year:"前 4 世紀",title:"百家爭鳴最熱鬧",text:"道家、法家、名家、陰陽家、農家、縱橫家齊齊登場，稷下學宮成為思想擂台。",school:"百家爭鳴"},{year:"前 3 世紀",title:"縱橫捭闔 · 雜家集大成",text:"蘇秦、張儀縱橫七國；呂不韋編《呂氏春秋》，嘗試整合百家。",school:"縱橫家 · 雜家"},{year:"前 221",title:"秦統一 · 法家實踐",text:"秦以法家思想統一六國，制度、法律、度量衡走向統一。",school:"法家"},{year:"前 136",title:"漢武帝獨尊儒術",text:"儒家成為官方正統，影響中國往後兩千年。",school:"儒家"}],lf=[{q:"第一題：喺茶餐廳見到有人打尖，你會點？",options:[{t:"企出嚟講道理，排隊先係規矩。",map:["ru","fa"]},{t:"算啦，唔好為小事勞氣。",map:["dao","xiao"]},{t:"即刻同全場人講返呢件事。",map:["xiao","ming"]},{t:"睇下點樣可以令大家都快啲有得食。",map:["mo","nong"]}]},{q:"第二題：你最嚮往嘅生活係？",options:[{t:"山水之間，琴棋書畫，悠然自得。",map:["dao"]},{t:"有影響力，可以改變社會。",map:["ru","fa","zong"]},{t:"腳踏實地，日出而作，豐衣足食。",map:["nong","mo"]},{t:"周圍遊歷，聽盡天下故事。",map:["xiao","zong"]}]},{q:"第三題：如果要你治國，你第一招會係？",options:[{t:"訂好法律，賞罰分明。",map:["fa"]},{t:"以德服人，教化百姓。",map:["ru"]},{t:"順應時勢，唔好搞咁多嘢。",map:["dao"]},{t:"搵齊各派高手，一齊諗辦法。",map:["za","zong"]}]},{q:"第四題：朋友搵你幫手，你最在意咩？",options:[{t:"公唔公平，幫人唔可以偏心。",map:["mo","fa"]},{t:"講清楚先，唔好誤會。",map:["ming","zong"]},{t:"隨心就好，唔好勉強。",map:["dao","xiao"]},{t:"一齊落手落腳做實事。",map:["nong","za"]}]},{q:"第五題：你覺得乜嘢最有價值？",options:[{t:"知識同智慧，可以傳承落去。",map:["ru","za"]},{t:"自由同內心平靜。",map:["dao"]},{t:"一句說話，改變大局。",map:["zong","ming"]},{t:"民間故事同生活智慧。",map:["xiao","yin"]}]}],Hm={ru:"你係天生嘅儒家！做人有原則、做事有交代，朋友有事第一個諗起你。",dao:"你係道家轉世！世事紛擾，你依然可以保持淡定，識得留白先係高手。",yin:"你係陰陽家！睇嘢睇得遠，識得順應節奏，連天氣變化都逃唔過你對眼。",fa:"你係法家！規則清楚、賞罰分明，畀你管嘅嘢，一定井井有條。",ming:"你係名家！一句說話都唔放過，辯論場上你就係全場焦點。",mo:"你係墨家！實幹、公平、肯幫人，係朋友圈入面最可靠嗰個。",zong:"你係縱橫家！口才了得，識得睇形勢，一開口就知有料到。",za:"你係雜家！乜都識啲、識得整合，團隊有你，咩難題都拆得掂。",nong:"你係農家！最貼地、最實在，識得用雙手創造真正嘅價值。",xiao:"你係小說家！最識聽故事、講故事，喺邊度都有你嘅江湖傳聞。"};function vu(){let[e,t]=yt.us
