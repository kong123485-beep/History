<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>History Archive - kong123485-beep/History</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:#fafaf9;color:#1c1917;padding:0}
header{background:#fff;border-bottom:1px solid #e7e5e4;padding:28px 24px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:30px} .sub{color:#78716c;margin-top:8px;font-size:14px}
.btn{display:inline-block;padding:10px 18px;border-radius:999px;background:#1c1917;color:#fff;text-decoration:none;font-weight:700;margin-right:8px;margin-top:12px}
.btn2{display:inline-block;padding:10px 18px;border-radius:999px;background:#fff;color:#1c1917;border:1px solid #e7e5e4;text-decoration:none;font-weight:700;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px}
.card{background:#fff;border:1px solid #e7e5e4;border-radius:16px;padding:18px}
.card h3{font-size:16px;margin-bottom:6px}
.card .file{font-family:monospace;font-size:11px;color:#78716c;word-break:break-all;margin-bottom:12px}
.card a{display:inline-block;width:48%;text-align:center;padding:8px 0;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600}
.a1{background:#1c1917;color:#fff} .a2{background:#f5f5f4;color:#1c1917;border:1px solid #e7e5e4}
#q{width:100%;max-width:520px;margin-top:18px;padding:12px 16px;border-radius:12px;border:1px solid #e7e5e4;font-size:15px}
h2{font-size:18px;margin-top:36px;margin-bottom:4px}
</style>
</head>
<body>
<header>
<div style="max-width:1120px;margin:0 auto">
<h1>History / 歷史檔案</h1>
<div class="sub">Directory: <a href="https://github.com/kong123485-beep/History" target="_blank">github.com/kong123485-beep/History</a> — 此 index.html 索引該目錄所有 related files</div>
<a class="btn" href="https://github.com/kong123485-beep/History" target="_blank">前往 GitHub 目錄 →</a>
<a class="btn2" href="https://kong123485-beep.github.io/History/" target="_blank">GitHub Pages 首頁</a>
<div><input id="q" placeholder="搜尋檔案：Cold War, 德川, 革命..."></div>
</div>
</header>
<div class="wrap">
<h2>📚 對比史學</h2><div class="grid" id="g1"></div>
<h2>🌍 世界大戰與冷戰</h2><div class="grid" id="g2"></div>
<h2>⛩️ 幕末德川</h2><div class="grid" id="g3"></div>
<h2>📜 政策文件</h2><div class="grid" id="g4"></div>
</div>
<script>
const BASE_PAGES="https://kong123485-beep.github.io/History/";
const BASE_GH="https://github.com/kong123485-beep/History/blob/main/";
const files=[
 {n:"Cold-War-Usa-Vs.html",zh:"冷戰對比：美國視角",cat:"g2"},
 {n:"French-Vs-Russian-Revolution.html",zh:"法國大革命 vs 俄國革命",cat:"g1"},
 {n:"Modernization-Japan-Vs-China.html",zh:"近代化：日本 vs 中國",cat:"g1"},
 {n:"Outbreak-Wwi-Vs-Wwii.html",zh:"大戰爆發：一次 vs 二次",cat:"g2"},
 {n:"Policy-Address-2026-Bilingual.html",zh:"2026 施政報告雙語版",cat:"g4"},
 {n:"Policy-Address-Bilingual.html",zh:"施政報告雙語版",cat:"g4"},
 {n:"Tokugawa-Fall-Original-Corrected.html",zh:"德川滅亡 - 原稿校正",cat:"g3"},
 {n:"Tokugawa-Fall-Reischauer.html",zh:"德川滅亡 - 賴肖爾",cat:"g3"},
 {n:"Unification-Italy-Vs-Germany.html",zh:"統一：意大利 vs 德國",cat:"g1"},
];
function render(list){
 ["g1","g2","g3","g4"].forEach(id=>document.getElementById(id).innerHTML="");
 list.forEach(f=>{
  const d=document.createElement("div"); d.className="card";
  d.innerHTML=`<h3>${f.zh}</h3><div class=file>${f.n}</div><div style="display:flex;gap:8px"><a class=a1 href="${BASE_PAGES}${f.n}" target="_blank">Pages 開啟</a><a class=a2 href="${BASE_GH}${f.n}" target="_blank">GitHub 原始碼</a></div><div style="margin-top:8px;font-size:11px;color:#a8a29e">絕對路徑已指向 kong123485-beep/History/${f.n}</div>`;
  document.getElementById(f.cat).appendChild(d);
 });
}
render(files);
document.getElementById("q").addEventListener("input",e=>{
 const k=e.target.value.toLowerCase();
 render(files.filter(f=>(f.zh+f.n).toLowerCase().includes(k)));
});
</script>
</body>
</html>
