  --muted-2:#57534e;
  --border:#e7e5e4;
  --soft:#f5f5f4;
  --accent:#16a34a;
  --accent-bg:#f0fdf4;
  --accent-border:#86efac;
  --accent-text:#166534;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#171512;
    --card:#201d1a;
    --text:#f5f5f4;
    --muted:#a8a29e;
    --muted-2:#d6d3d1;
    --border:#44403c;
    --soft:#292524;
    --accent:#4ade80;
    --accent-bg:#172a1e;
    --accent-border:#2f6b43;
    --accent-text:#bbf7d0;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif
}

.font-serif-tc{
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}

.card{
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease
}

.card:hover{
  transform:translateY(-3px);
  border-color:#a8a29e;
  box-shadow:0 10px 28px rgba(0,0,0,.07)
}

.hover\:-translate-y-\[1px\]:hover {
  --tw-translate-y: -1px;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:border-\[var\(--muted\)\]:hover {
  border-color: var(--muted);
}

.hover\:bg-\[var\(--soft\)\]:hover {
  background-color: var(--soft);
}

.hover\:text-\[var\(--text\)\]:hover {
  color: var(--text);
}

.hover\:opacity-90:hover {
  opacity: 0.9;
}

.focus\:border-\[var\(--text\)\]:focus {
  border-color: var(--text);
}

@media (min-width: 640px) {
  .sm\:flex-none {
    flex: none;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:text-\[22px\] {
    font-size: 22px;
  }

  .sm\:text-\[46px\] {
    font-size: 46px;
  }
}

@media (min-width: 768px) {
  .md\:w-\[420px\] {
    width: 420px;
  }

  .md\:w-auto {
    width: auto;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
